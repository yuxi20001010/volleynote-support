<main><h1>排球逐球得失分紀錄</h1><p class="meta">給球經與球員的排球記分 App</p>
<p>排記是給排球隊的逐球得失分紀錄 App。球經在場邊一球一記，球員用自己的手機就能看到個人與全隊數據。</p>
<ul><li>點兩下記完一球，比分與統計即時算好</li><li>站位、輪轉、換人紀錄，記錯了隨時可改</li><li>「👍 好球」記錄救球、好一傳，讓自由球員的貢獻也被看見</li><li>沒有網路也能記，恢復連線後自動同步</li></ul>
<p>即將在 App Store 上架。</p>
